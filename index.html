    <!-- Structured Data: WebApplication + FAQPage (rich results eligibility) -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LittlePings",
        "url": "https://littlepings.com",
        "description": "A free, safe keyboard-smashing toy for toddlers and babies. Press any key to create colourful emoji bubbles, playful piano pings, and animations.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "audience": {
          "@type": "PeopleAudience",
          "suggestedMinAge": 0,
          "suggestedMaxAge": 5
        },
        "inLanguage": "en",
        "screenshot": "https://littlepings.com/og-image.png",
        "featureList": [
          "Colourful emoji bubbles on every key press",
          "Piano-style sound effects",
          "6 visual themes: Candy, Ocean, Jungle, Space, Sunset, Arctic",
          "Parent lock with PIN",
          "No ads, no accounts, completely free"
        ]
      },
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is LittlePings free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, completely free. No ads, no accounts, and no in-app purchases — ever."
            }
          },
          {
            "@type": "Question",
            "name": "Is LittlePings safe for babies and toddlers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. There are no links, no ads, no external content, and no data collected. It is a closed keyboard-smashing toy designed specifically for babies and toddlers aged 0–5."
            }
          },
          {
            "@type": "Question",
            "name": "Does LittlePings work on mobile and tablets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. LittlePings works on any device with a browser — desktop, tablet, or mobile. Tap anywhere on a touchscreen to create bubbles."
            }
          },
          {
            "@type": "Question",
            "name": "Does LittlePings work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. LittlePings is a Progressive Web App (PWA) and works fully offline after the first visit. You can also install it to your home screen."
            }
          },
          {
            "@type": "Question",
            "name": "What themes does LittlePings have?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "LittlePings has 6 colour themes: Candy, Ocean, Jungle, Space, Sunset, and Arctic — each with unique bubble colours and backgrounds."
            }
          }
        ]
      }
    ]
    </script>
